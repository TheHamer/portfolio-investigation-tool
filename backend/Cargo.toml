[package]
name = "portfolio-investigation"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
# Only the explicit [[bin]] below; stops Cargo also inferring a binary named
# "main" from src/bin/main.rs.
autobins = false

[lib]
name = "portfolio_investigation"
path = "src/lib.rs"

[[bin]]
name = "portfolio-investigation"
path = "src/bin/main.rs"

[dependencies]
config = { version = "0.15", default-features = false, features = ["toml"] }
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12", default-features = false, features = ["with-rejection"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
csv = "1.3"
rust_decimal = { version = "1.36", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
